name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run verify:geometry
      - run: npm run verify:field
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser -- /tmp/rajju-browser
      - run: python3 scripts/geometry-oracle.py --rendered < /tmp/rajju-browser/browser.json
      - run: npm run test:offline
      - run: npm run test:field -- /tmp/rajju-field
      - run: node --import tsx scripts/field-cases.ts | python3 scripts/field-oracle.py /tmp/rajju-field/review.json
